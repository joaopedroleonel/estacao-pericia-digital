{% extends "base.html" %}

{% block body_class %}page-centered{% endblock %}

{% block content %}
<main class="card">
  <h1 class="card-title">Estação de Perícia</h1>
  <form class="login-form" method="post" action="{{ url_for('auth.login') }}">
    <label class="login-label" for="code">Código de acesso</label>
    <input class="login-code" id="code" name="code" type="password" inputmode="numeric"
           pattern="[0-9]{4}" maxlength="4" autocomplete="off" required autofocus>
    <button class="button" type="submit">Entrar</button>
  </form>
  {% if error == "invalid" %}
  <p class="form-message is-error">Código incorreto.</p>
  {% elif error == "locked" %}
  <p class="form-message is-error">Muitas tentativas. Aguarde {{ minutes }} min.</p>
  {% endif %}
</main>
{% endblock %}
