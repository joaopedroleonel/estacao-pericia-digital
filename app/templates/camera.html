{% extends "base.html" %}

{% block title %}Inserir foto{% endblock %}

{% block body_class %}page-centered{% endblock %}

{% block content %}
<main class="camera">
  <label class="button button-large">
    Inserir foto
    <input class="camera-input" id="photo-input" type="file" accept="image/*">
  </label>
  <p class="form-message" id="upload-status" aria-live="polite"></p>
</main>
{% endblock %}

{% block scripts %}
<script type="module" src="{{ url_for('static', filename='js/camera.js') }}"></script>
{% endblock %}
